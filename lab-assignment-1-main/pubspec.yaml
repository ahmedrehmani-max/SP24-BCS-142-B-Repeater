name: crud_sqlite
description: "Lab Assignment 1 — Flutter CRUD app (Add / Update / Delete) backed by SQLite."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Local SQLite storage
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.7 # SQLite support when running on desktop
  path: ^1.9.1
  path_provider: ^2.1.5

  # Picking a profile picture
  image_picker: ^1.2.0
  image_picker_linux: ^0.2.1 # desktop implementation (not endorsed by default)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
